# docker compose up --build  ->  API on http://localhost:4000
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: taskflow }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskflow
      DIRECT_URL: postgresql://postgres:postgres@db:5432/taskflow
      JWT_SECRET: dev-only-change-me
      WEB_ORIGIN: http://localhost:5173
