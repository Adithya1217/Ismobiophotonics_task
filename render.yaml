# One-click deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Creates Postgres + ONE web service that serves the API and the web app (same origin, no CORS/cookie issues).
databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
services:
  - type: web
    name: taskflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w apps/web && npm run build -w apps/api && npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run seed -w apps/api
    startCommand: npm start -w apps/api
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SERVE_WEB, value: "true" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: taskflow-db, property: connectionString } }
      - { key: DIRECT_URL, fromDatabase: { name: taskflow-db, property: connectionString } }
